name: repository-quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[quality]"
      - name: Compile source
        run: python -m compileall -q src tests tools application
      - name: Static checks
        run: ruff check src tests tools application
      - name: Unit tests
        run: pytest
      - name: Repository contract
        run: python tools/verify_repository.py
